<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Draw your alphabet and get an installable font back. Runs entirely in your browser." />
    <meta name="theme-color" content="#ece7dc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://glyph.flynndiener.ch/" />
    <title>glyph: handwriting to font</title>
    <script>
      // Sets the theme before the first paint, so a dark page never flashes light.
      try {
        var theme = JSON.parse(localStorage.getItem('glyph.settings.v1') || '{}').theme;
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        // Storage is blocked. The app sets the theme once it starts.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
